    <rect x="294" y="76" width="82" height="40" rx="5" fill="#6cc5b0"/><text x="335" y="101" text-anchor="middle">6cc5b0</text>
    <rect x="384" y="76" width="82" height="40" rx="5" fill="#3ca951"/><text x="425" y="101" text-anchor="middle" fill="#fff">3ca951</text>
    <rect x="474" y="76" width="82" height="40" rx="5" fill="#ff8ab7"/><text x="515" y="101" text-anchor="middle" fill="#fff">ff8ab7</text>
    <rect x="564" y="76" width="52" height="40" rx="5" fill="#a463f2"/><text x="590" y="101" text-anchor="middle" fill="#fff">f2</text>
  </g>

  <text x="24" y="148" font-family="system-ui, sans-serif" font-size="12" fill="#57534e">顺序色板 · 明度单调递增</text>
  <g>
    <rect x="24" y="158" width="118" height="40" rx="5" fill="#f7fcfd" stroke="#e7e5e4"/>
    <rect x="142" y="158" width="118" height="40" rx="5" fill="#ccece6"/>
    <rect x="260" y="158" width="118" height="40" rx="5" fill="#7bccc4"/>
    <rect x="378" y="158" width="118" height="40" rx="5" fill="#2b8cbe"/>
