  <text x="24" y="66" font-family="system-ui, sans-serif" font-size="12" fill="#57534e">分类色 · Okabe-Ito 方向，色盲友好</text>
  <g font-family="system-ui, sans-serif" font-size="10" fill="#44403c">
    <rect x="24" y="76" width="82" height="40" rx="5" fill="#4269d0"/><text x="65" y="101" text-anchor="middle" fill="#fff">4269d0</text>
    <rect x="114" y="76" width="82" height="40" rx="5" fill="#efb118"/><text x="155" y="101" text-anchor="middle" fill="#fff">efb118</text>
