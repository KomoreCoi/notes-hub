<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <meta name="description" content="按主题归档的 Markdown 笔记">
  <!-- 内联 SVG favicon，省一个文件，也避免浏览器去请求 /favicon.ico 拿 404 -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231d9e75'/%3E%3Cpath d='M8 9h16M8 16h16M8 23h10' stroke='%23fff' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E">
  <meta property="og:title" content="我的笔记">
  <meta property="og:description" content="按主题归档的 Markdown 笔记">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://komorecoi.github.io/notes-hub/">
  <title>我的笔记</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/themes/vue.css">
  <style>
    :root {
      --theme-color: #1d9e75;
      --theme-color-dark: #0f6e56;
      --bg-page: #f6f1e7;       /* 主体暖米 */
      --bg-sidebar: #ece4d2;    /* 侧边栏深一点的米色 */
      --bg-code: #efe9d9;       /* 代码块背景 */
      --bg-card: #fbf7ec;       /* 内容区亮一点点区分 */
      --border-soft: #d8cfb8;   /* 边框米色 */
    }
    body { background: var(--bg-page); }
    .sidebar { background: var(--bg-sidebar); border-color: var(--border-soft) !important; }
    .sidebar ul li a { color: #3d3a30; }
    .sidebar ul li.active > a,
    .sidebar ul li a:hover { color: var(--theme-color-dark); }
    .markdown-section { background: transparent; }
    .markdown-section h1, .markdown-section h2, .markdown-section h3,
    .markdown-section h4, .markdown-section h5, .markdown-section h6 {
      color: #2b2a25;
      font-weight: 600;
    }
    .markdown-section h1 { padding-bottom: .4em; border-bottom: 1px solid var(--border-soft); }
    .markdown-section a { color: var(--theme-color-dark); }
    .markdown-section blockquote {
      margin: 1em 0;
      padding: .2em 1em;
      color: #5d5a4e;
      border-left: 4px solid var(--border-soft);
      background: var(--bg-card);
    }
    .markdown-section table tr:nth-child(2n) { background: var(--bg-card); }
    .markdown-section table th { background: var(--bg-sidebar); }
    .markdown-section pre { background: var(--bg-code) !important; }
    .markdown-section code { background: rgba(0, 0, 0, .04); padding: .12em .35em; border-radius: 3px; }
    /* 中文环境下正文默认字体偏细、字距偏紧，这里补一点 */
    .markdown-section {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", "Source Han Sans SC", sans-serif;
      font-size: 16px;
      line-height: 1.75;
      letter-spacing: 0.01em;
    }
    /* 代码块内强制西文字体，否则中英混排会很难看。
       position:relative 是给右上角的复制按钮做定位锚点。 */
    .markdown-section pre[data-lang] {
      position: relative;
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
      line-height: 1.6;
      tab-size: 2;
    }
    /* 代码块的两个角标共用一套外观：右上角的复制按钮（JS 插入，hover 才浮现）
       和左上角的语言标签（伪元素，常驻不隐藏）。共用同一组属性，以后调样式
       只改这一处，两者不会走样。
       顺带关掉 vue.css 的旧标签 —— 它是右上角 9.6px 的 #ccc 浅灰，
       压在米色底上几乎看不见，还正好被复制按钮盖住。 */
    .markdown-section pre:after { display: none; }
    .copy-btn,
    .markdown-section pre[data-lang]:before {
      position: absolute;
      top: 8px;
      z-index: 10;
      padding: 4px 10px;
      font-size: 12px;
      line-height: 1.4;
      color: #888;
      background: rgba(255, 255, 255, .92);
      border: 1px solid #e0e0e0;
      border-radius: 4px;
    }
    .markdown-section pre[data-lang]:before {
      content: attr(data-lang);
      left: 8px;
      pointer-events: none;
    }
    /* vue.css 给 pre>code 的顶部留白是 padding:2.2em（12.8px 字号下约 28px），
       那点空间只够放原来那个 9.6px 的小字标签。左上角这个常驻角标跟右上角
       的复制按钮同尺寸（高约 27px），不改这里就会压到第一行代码。
       2.2em -> 3em，顶部多留约 10px，代码内容一行都不动。 */
    .markdown-section pre[data-lang] > code {
      padding-top: 3em;
    }
    .markdown-section code { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; }
    /* 图片不要撑破容器 */
    .markdown-section img {
      max-width: 100%;
      border-radius: 6px;
      display: block;
      margin: 1.2em auto;
    }
    .copy-btn {
      right: 8px;
      cursor: pointer;
      opacity: 0;
      transition: opacity .2s, color .2s, border-color .2s;
    }
    pre[data-lang]:hover .copy-btn { opacity: 1; }
    /* 触屏设备没有 hover 状态，上面的规则永远不会命中，按钮会一直停在
       opacity:0 —— 等于手机上完全无法复制。这里让它在无 hover 的环境常驻。 */
    @media (hover: none) {
      .copy-btn { opacity: 1; }
    }
    /* 复制按钮 hover / 复制完成时变绿；语言标签保持灰色不动，
       它是常驻的静态信息，不该跟着鼠标状态跳色。 */
    pre[data-lang]:hover .copy-btn,
    .copy-btn:hover,
    .copy-btn.done { color: #1d9e75; border-color: #1d9e75; }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg-page: #1d1b16;
        --bg-sidebar: #15140f;
        --bg-code: #25221b;
        --bg-card: #25221b;
        --border-soft: #3a362a;
      }
      .markdown-section h1 { color: #f0ebe0; }
      .markdown-section, .markdown-section p, .markdown-section li,
      .markdown-section table td, .markdown-section table th { color: #d8d2c2; }
      /* 深色下白底标签会刺眼，两个角标一起换成深底灰字 */
      .copy-btn,
      .markdown-section pre[data-lang]:before {
        background: rgba(40, 40, 40, .92);
        color: #aaa;
        border-color: #444;
      }
      pre[data-lang]:hover .copy-btn,
      .copy-btn:hover,
      .copy-btn.done { color: #6fd6b0; border-color: #6fd6b0; }
    }
    /* 关闭 loadNavbar 后仍可能存在的空容器，强制隐藏 */
    .app-nav { display: none !important; }
    body { padding-top: 0 !important; }
    /* 侧边栏切换按钮：vue.css 主题在打开态强制 width: 284px（一个大白块），
       这里把它收回 auto，跟关闭态一致 —— 用户说"关闭时什么样就什么样"。 */
    .sidebar-toggle {
      width: auto !important;
    }
  </style>
</head>
<body>
  <div id="app">正在加载…</div>

  <script>
    window.$docsify = {
      name: '我的笔记',
      repo: '',
      logo: '',
      loadSidebar: true,
      loadNavbar: false,
      coverpage: false,
      onlyCoverHome: false,
      // 关键：让文档内的相对链接/图片按当前文件所在目录解析，
      // 这正是 a/notes.md 里写 images/x.png 能工作的原因。
      relativePath: true,
      // 目录里前两级标题也进侧边栏
      subMaxLevel: 2,
      maxLevel: 4,
      auto2top: true,
      // 顶部没有一个固定导航栏了（app-nav 已 display:none），再留 72px
      // 会让锚点跳转把标题顶出可视区一大截。哪天恢复了 navbar 要改回来。
      topMargin: 0,
      notFoundPage: true,
      themeColor: '#1d9e75',

      search: {
        placeholder: '搜索笔记…',
        noData: '没有找到相关内容',
        depth: 3,
        paths: 'auto',
        hideOtherSidebarContent: false,
        namespace: 'notes',
        // 实测过（jsdom 里跑真实索引）：内置 search 是**子串正则匹配**，
        // 不是分词检索。query.split(/[\s\-，\\/]+/) 只在有空格/连字符时才切开，
        // 中文整句会原样变成一个正则去正文里找 —— 所以搜「数据清洗」「缺失值」
        // 「整数除法」都能正常命中，中文反而是这套实现的强项。
        // 真正的局限只有两条：必须连续子串（页面写「缺失值」时搜「缺失值处理」
        // 搜不到），以及不支持错别字容错。要更强的语义搜索才需要换掉整个插件。
      },

      // 注意是 previousText 不是 prevText，写错这个键插件会用默认的 "PREVIOUS"
      pagination: {
        previousText: '← 上一篇',
        nextText: '下一篇 →',
        crossChapter: true,
        crossChapterText: true
      },

      // 代码复制按钮。
      //
      // 踩了两个坑，都记在这里别再犯：
      //   1. docsify v4 的生命周期只有 init / mounted / beforeEach /
      //      afterEach / doneEach / ready —— 没有 done。写 hook.done 会抛
      //      TypeError，且默认 catchPluginErrors:true 会把异常静默吞掉，
      //      表现为「按钮一个都不出现」且完全没有报错。
      //   2. 代码块渲染出来是 <pre v-pre data-lang="sql">，**不是**
      //      <div class="language-sql">（那是 VitePress/marked 默认那套）。
      //      错写成 div[class^="language-"] 会匹配到 0 个元素。
      plugins: [
        function (hook) {
          hook.doneEach(function () {
            document.querySelectorAll('.markdown-section pre[data-lang]').forEach(function (el) {
              if (el.querySelector('.copy-btn')) return;
              var btn = document.createElement('button');
              btn.className = 'copy-btn';
              btn.textContent = '复制';
              btn.addEventListener('click', function () {
                var code = el.querySelector('code');
                if (!code) return;
                // textContent 而不是 innerText：innerText 跟着渲染走，
                // 代码块一旦溢出滚动，取出来的换行会被吞掉。
                var text = code.textContent;
                var reset = function (label, cls) {
                  btn.textContent = label;
                  if (cls) btn.classList.add(cls);
                  setTimeout(function () {
                    btn.textContent = '复制';
                    btn.classList.remove('done');
                  }, 1600);
                };
                var done = function () { reset('已复制', 'done'); };
                var fail = function () { reset('复制失败'); };
                // 老办法：临时 textarea + execCommand。非安全上下文（http 本地预览）
                // 和 clipboard API 被拒时都靠它兜底。
                var legacyCopy = function () {
                  var ta = document.createElement('textarea');
                  ta.value = text;
                  ta.style.position = 'fixed';
                  ta.style.opacity = '0';
                  document.body.appendChild(ta);
                  ta.select();
                  var ok = false;
                  try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
                  document.body.removeChild(ta);
                  return ok;
                };
                if (navigator.clipboard && window.isSecureContext) {
                  // 必须处理 reject：权限被拒 / 页面在 iframe 里被权限策略拦住时，
                  // writeText 会 reject。只写 .then(done) 的话就是一次 unhandled
                  // rejection —— 用户点了按钮，界面一点反应都没有。
                  navigator.clipboard.writeText(text).then(done, function () {
                    if (legacyCopy()) done();
                    else fail();
                  });
                } else if (legacyCopy()) {
                  done();
                } else {
                  fail();
                }
              });
              el.appendChild(btn);
            });
          });
        }
      ]
    };
  </script>

  <!-- CDN 一律锁到具体版本（原来是 @4 / @1 浮动），避免上游大版本更新把站点弄坏。
       升级时手动改版本号并本地 npm run dev 验证一遍。 -->
  <script src="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/docsify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/plugins/zoom-image.min.js"></script>
  <!-- pagination 是真的插件文件，不引入的话上面的 pagination 配置一个字都不会生效 -->
  <script src="https://cdn.jsdelivr.net/npm/docsify-pagination@2.10.1/dist/docsify-pagination.min.js"></script>

  <!-- 代码高亮语言，按需增删。顺序无所谓，都挂在 Prism 上 -->
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.30.0/components/prism-bash.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.30.0/components/prism-python.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.30.0/components/prism-sql.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.30.0/components/prism-yaml.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.30.0/components/prism-json.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.30.0/components/prism-r.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.30.0/components/prism-javascript.min.js"></script>
  <!-- 本站自己讲的是 Markdown 语法，没有它 ```markdown 代码块不会高亮 -->
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.30.0/components/prism-markdown.min.js"></script>
</body>
</html>
